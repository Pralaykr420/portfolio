<!doctype html>
<html lang="en">
  <head>
    <!-- ============================= -->
    <!-- BASIC DOCUMENT CONFIGURATION -->
    <!-- ============================= -->

    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <!-- ============================= -->
    <!-- PRIMARY SEO -->
    <!-- ============================= -->

    <title>
      Pralay Kumar Mahata | Full Stack Developer & AI Engineer
    </title>

    <meta
      name="description"
      content="Pralay Kumar Mahata is a Full Stack Developer and AI Engineer specializing in React, JavaScript, Node.js, AI-powered applications, and modern web development."
    />

    <meta
      name="keywords"
      content="Pralay Kumar Mahata, Pralay Mahata, Full Stack Developer, AI Engineer, React Developer, JavaScript Developer, Node.js Developer, AI Developer, Web Developer, Software Developer, React Node.js Developer, AI Applications"
    />

    <meta name="author" content="Pralay Kumar Mahata" />

    <meta
      name="creator"
      content="Pralay Kumar Mahata"
    />

    <meta
      name="publisher"
      content="Pralay Kumar Mahata"
    />

    <meta
      name="robots"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />

    <meta
      name="googlebot"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />

    <meta
      name="bingbot"
      content="index, follow"
    />

    <!-- Replace with your real domain -->
    <link
      rel="canonical"
      href="https://yourdomain.com/"
    />

    <!-- ============================= -->
    <!-- LANGUAGE / REGION -->
    <!-- ============================= -->

    <meta
      http-equiv="content-language"
      content="en"
    />

    <!-- ============================= -->
    <!-- THEME / BROWSER -->
    <!-- ============================= -->

    <meta
      name="theme-color"
      content="#0a0a0a"
    />

    <meta
      name="color-scheme"
      content="dark light"
    />

    <meta
      name="mobile-web-app-capable"
      content="yes"
    />

    <meta
      name="apple-mobile-web-app-capable"
      content="yes"
    />

    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />

    <meta
      name="apple-mobile-web-app-title"
      content="Pralay Kumar Mahata"
    />

    <!-- ============================= -->
    <!-- FAVICON -->
    <!-- ============================= -->

    <link
      rel="icon"
      type="image/svg+xml"
      href="/icon.svg"
    />

    <link
      rel="apple-touch-icon"
      href="/icon.svg"
    />

    <!-- ============================= -->
    <!-- OPEN GRAPH / FACEBOOK / LINKEDIN -->
    <!-- ============================= -->

    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:locale"
      content="en_US"
    />

    <meta
      property="og:title"
      content="Pralay Kumar Mahata | Full Stack Developer & AI Engineer"
    />

    <meta
      property="og:description"
      content="Portfolio of Pralay Kumar Mahata — Full Stack Developer and AI Engineer building modern web applications and AI-powered products."
    />

    <meta
      property="og:url"
      content="https://yourdomain.com/"
    />

    <meta
      property="og:site_name"
      content="Pralay Kumar Mahata"
    />

    <!--
      Create an OG image such as:
      public/og-image.jpg

      Recommended size:
      1200 × 630
    -->
    <meta
      property="og:image"
      content="https://yourdomain.com/og-image.jpg"
    />

    <meta
      property="og:image:width"
      content="1200"
    />

    <meta
      property="og:image:height"
      content="630"
    />

    <meta
      property="og:image:alt"
      content="Pralay Kumar Mahata - Full Stack Developer and AI Engineer"
    />

    <!-- ============================= -->
    <!-- TWITTER / X -->
    <!-- ============================= -->

    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="Pralay Kumar Mahata | Full Stack Developer & AI Engineer"
    />

    <meta
      name="twitter:description"
      content="Full Stack Developer and AI Engineer specializing in React, JavaScript, Node.js and AI-powered applications."
    />

    <meta
      name="twitter:image"
      content="https://yourdomain.com/og-image.jpg"
    />

    <meta
      name="twitter:image:alt"
      content="Pralay Kumar Mahata - Full Stack Developer and AI Engineer"
    />

    <!-- ============================= -->
    <!-- STRUCTURED DATA - PERSON -->
    <!-- ============================= -->

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "@id": "https://yourdomain.com/#person",
        "name": "Pralay Kumar Mahata",
        "url": "https://yourdomain.com/",
        "jobTitle": "Full Stack Developer & AI Engineer",
        "description": "Full Stack Developer and AI Engineer specializing in React, JavaScript, Node.js and AI-powered applications.",
        "image": "https://yourdomain.com/profile.jpg",
        "knowsAbout": [
          "Full Stack Development",
          "React",
          "JavaScript",
          "Node.js",
          "Artificial Intelligence",
          "AI Applications",
          "Web Development",
          "Frontend Development",
          "Backend Development",
          "Software Engineering"
        ],
        "sameAs": [
          "https://github.com/YOUR_GITHUB_USERNAME",
          "https://www.linkedin.com/in/YOUR_LINKEDIN_USERNAME"
        ]
      }
    </script>

    <!-- ============================= -->
    <!-- STRUCTURED DATA - WEBSITE -->
    <!-- ============================= -->

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "@id": "https://yourdomain.com/#website",
        "url": "https://yourdomain.com/",
        "name": "Pralay Kumar Mahata",
        "description": "Portfolio of Pralay Kumar Mahata, Full Stack Developer and AI Engineer.",
        "publisher": {
          "@type": "Person",
          "name": "Pralay Kumar Mahata"
        },
        "inLanguage": "en"
      }
    </script>

    <!-- ============================= -->
    <!-- STRUCTURED DATA - PROFILE PAGE -->
    <!-- ============================= -->

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ProfilePage",
        "@id": "https://yourdomain.com/#profile",
        "url": "https://yourdomain.com/",
        "name": "Pralay Kumar Mahata | Full Stack Developer & AI Engineer",
        "description": "Professional portfolio of Pralay Kumar Mahata, Full Stack Developer and AI Engineer.",
        "mainEntity": {
          "@type": "Person",
          "name": "Pralay Kumar Mahata",
          "url": "https://yourdomain.com/"
        }
      }
    </script>

    <!-- ============================= -->
    <!-- PERFORMANCE -->
    <!-- ============================= -->

    <!--
      Uncomment only if you actually use external domains.

      Example:
      <link rel="preconnect" href="https://fonts.googleapis.com" />
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    -->

    <!-- ============================= -->
    <!-- VITE / REACT APPLICATION -->
    <!-- ============================= -->
  </head>

  <body>
    <noscript>
      <div>
        JavaScript is required to view the portfolio of Pralay Kumar Mahata.
      </div>
    </noscript>

    <div id="root"></div>

    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
